name: Build PS4 FPKG

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Custom Content-ID (optional)'
        required: false

permissions:
  contents: read

jobs:
  build-fpkg:
    name: Build FPKG for Jailbroken PS4
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            python3 python3-pip python3-venv \
            libssl-dev pkg-config wget curl unzip \
            clang lld llvm libelf-dev \
            xorriso python3-cryptography

      - name: Download Pre-built OpenOrbis Toolchain
        id: get-sdk
        run: |
          cd ~
          SDK_DIR="openorbis-sdk"
          
          # Try multiple known pre-built toolchain sources
          TOOLCHAIN_URLS=(
            "https://github.com/OpenOrbis/openorbis-sdk/releases/latest/download/openorbis-sdk-linux.tar.gz"
            "https://github.com/OpenOrbis/ps4-toolchain/releases/latest/download/openorbis-toolchain-linux.tar.gz"
            "https://github.com/orbisdev/orbisdev-toolchain/releases/latest/download/orbisdev-toolchain-linux.tar.gz"
            "https://github.com/OpenOrbis/openorbis-sdk/releases/download/v1.0/openorbis-sdk-linux.tar.gz"
          )
          
          DOWNLOADED=false
          
          for URL in "${TOOLCHAIN_URLS[@]}"; do
            echo "Trying: $URL"
            if wget -q --spider "$URL" 2>/dev/null; then
              echo "Found: $URL"
              wget -q "$URL" -O toolchain.tar.gz
              tar -xzf toolchain.tar.gz
              # Handle different archive structures
              mv openorbis-sdk-* "$SDK_DIR" 2>/dev/null || \
              mv openorbis-toolchain-* "$SDK_DIR" 2>/dev/null || \
              mv orbisdev-toolchain-* "$SDK_DIR" 2>/dev/null || \
              mv openorbis-sdk "$SDK_DIR" 2>/dev/null || \
              mv openorbis-toolchain "$SDK_DIR" 2>/dev/null || \
              mv orbisdev-toolchain "$SDK_DIR" 2>/dev/null
              DOWNLOADED=true
              echo "✅ Downloaded from: $URL"
              break
            else
              echo "Not found: $URL"
            fi
          done
          
          # Fallback: Build from source if download fails
          if [ "$DOWNLOADED" = false ]; then
            echo "No pre-built toolchain found, building from source..."
            
            # Try to clone and build from known sources
            SDK_SOURCES=(
              "https://github.com/OpenOrbis/openorbis-sdk"
              "https://github.com/OpenOrbis/ps4-sdk"
              "https://github.com/orbisdev/orbisdev-sdk"
              "https://github.com/ps4dev/ps4-sdk"
            )
            
            CLONED=false
            for SRC in "${SDK_SOURCES[@]}"; do
              echo "Trying to clone: $SRC"
              for i in {1..3}; do
                git clone --depth=1 --recurse-submodules --shallow-submodules "$SRC" openorbis-sdk && { CLONED=true; break; }
                echo "Retry $i/3..."
                sleep 10
              done
              if [ "$CLONED" = true ]; then break; fi
            done
            
            if [ "$CLONED" = false ]; then
              echo "❌ All SDK acquisition methods failed"
              exit 1
            fi
            
            cd openorbis-sdk
            ./build-toolchain.sh 2>&1 | tee build-toolchain.log
          fi
          
          # Verify SDK
          if [ -f "$SDK_DIR/environment.sh" ]; then
            echo "SDK_PATH=$SDK_DIR" >> $GITHUB_OUTPUT
            echo "✅ SDK ready at ~/$SDK_DIR"
          else
            # Try to find environment.sh in subdirectories
            ENV_PATH=$(find ~ -name "environment.sh" -path "*/openorbis*" 2>/dev/null | head -1)
            if [ -n "$ENV_PATH" ]; then
              SDK_FOUND_DIR=$(dirname "$ENV_PATH")
              echo "SDK_PATH=$SDK_FOUND_DIR" >> $GITHUB_OUTPUT
              echo "✅ SDK ready at ~/$SDK_FOUND_DIR"
            else
              echo "❌ SDK not found"
              find ~ -name "environment.sh" 2>/dev/null | head -5
              exit 1
            fi
          fi
        timeout-minutes: 60

      - name: Setup PS4SDK Environment
        run: |
          source ~/${{ steps.get-sdk.outputs.SDK_PATH }}/environment.sh
          echo "PS4SDK=$PS4SDK" >> $GITHUB_ENV
          echo "$PS4SDK/bin" >> $GITHUB_PATH
          $CC --version

      - name: Build PS4SplitScreenConnector
        run: |
          source ~/${{ steps.get-sdk.outputs.SDK_PATH }}/environment.sh
          cd ${{ github.workspace }}
          ./scripts/build_ps4.sh Release
        timeout-minutes: 30

      - name: Build orbis-pub-fpkg
        run: |
          source ~/${{ steps.get-sdk.outputs.SDK_PATH }}/environment.sh
          cd ~
          for i in {1..3}; do
            git clone https://github.com/OpenOrbis/orbis-pub-gen 2>/dev/null && break
            echo "Retry $i/3..."
            sleep 10
          done
          cd orbis-pub-gen
          mkdir -p build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$PS4SDK
          make -j$(nproc)
          sudo make install
        timeout-minutes: 30

      - name: Generate FPKG Config
        id: fpkg-config
        run: |
          cd ${{ github.workspace }}
          mkdir -p output
          
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          CONTENT_ID="${{ github.event.inputs.content_id }}"
          if [ -z "$CONTENT_ID" ]; then
            CONTENT_ID="UP0001-PS4SPLITSCREEN_00-${SHORT_SHA}000000"
          fi
          PASSCODE="00000000000000000000000000000000"
          
          cp scripts/fpkg.conf.template output/fpkg.conf
          sed -i "s|UP0001-PS4SPLITSCREEN_00-0000000000000000|${CONTENT_ID}|" output/fpkg.conf
          sed -i "s|Passcode = 00000000000000000000000000000000|Passcode = ${PASSCODE}|" output/fpkg.conf
          sed -i "s|\"eboot.bin\" = \"build_ps4/bin/splitscreen_demo\"|\"eboot.bin\" = \"build_ps4/bin/splitscreen_demo\"|" output/fpkg.conf
          
          echo "content_id=${CONTENT_ID}" >> $GITHUB_OUTPUT
          echo "FPKG config generated with Content-ID: ${CONTENT_ID}"

      - name: Create FPKG
        run: |
          source ~/${{ steps.get-sdk.outputs.SDK_PATH }}/environment.sh
          cd ${{ github.workspace }}/output
          
          FPKG_NAME="PS4SplitScreenConnector_${{ steps.fpkg-config.outputs.content_id }}.fpkg"
          
          orbis-pub-fpkg -config fpkg.conf -output "${FPKG_NAME}"
          
          echo "fpkg_name=${FPKG_NAME}" >> $GITHUB_OUTPUT
          echo "fpkg_path=${{ github.workspace }}/output/${FPKG_NAME}" >> $GITHUB_OUTPUT
        timeout-minutes: 10

      - name: Verify FPKG
        run: |
          cd ${{ github.workspace }}/output
          FPKG_NAME="${{ steps.create-fpkg.outputs.fpkg_name }}"
          
          if [ -f "${FPKG_NAME}" ]; then
            SIZE=$(du -h "${FPKG_NAME}" | cut -f1)
            echo "✅ FPKG created successfully!"
            echo "File: ${FPKG_NAME}"
            echo "Size: ${SIZE}"
            echo "Content-ID: ${{ steps.fpkg-config.outputs.content_id }}"
          else
            echo "❌ FPKG not found!"
            ls -la
            exit 1
          fi
        timeout-minutes: 5

      - name: Upload FPKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4SplitScreenConnector-fpkg
          path: ${{ github.workspace }}/output/*.fpkg
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ github.workspace }}/output/*.fpkg
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: FPKG Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}